version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    labels:
      - "type: dependencies"
      - "status: needs-triage"
    groups:
      frontend-toolchain:
        patterns:
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "typescript"
          - "vite"
          - "@vitejs/*"
          - "eslint"
          - "@eslint/*"
          - "eslint-*"
          - "globals"
        update-types:
          - minor
          - patch
      react-and-tests:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "vitest"
          - "@testing-library/*"
          - "jsdom"
          - "playwright-core"
        update-types:
          - minor
          - patch
      npm-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@tauri-apps/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "typescript"
          - "vite"
          - "@vitejs/*"
          - "eslint"
          - "@eslint/*"
          - "eslint-*"
          - "globals"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "vitest"
          - "@testing-library/*"
          - "jsdom"
          - "playwright-core"
        update-types:
          - minor
          - patch
    ignore:
      # Tauri spans npm and Cargo manifests. Dependabot cannot update both
      # ecosystems atomically, so these packages are upgraded together by hand.
      - dependency-name: "@tauri-apps/*"
      - dependency-name: "typescript"
        versions:
          - ">=6.1.0"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    labels:
      - "type: dependencies"
      - "status: needs-triage"
    groups:
      cargo-patches:
        patterns:
          - "*"
        exclude-patterns:
          - "tauri"
          - "tauri-*"
          - "sqlx"
        update-types:
          - patch
    ignore:
      # Keep the Rust crates aligned with the matching @tauri-apps packages.
      - dependency-name: "tauri"
      - dependency-name: "tauri-*"
      - dependency-name: "sqlx"
        versions:
          - ">=0.9.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
    labels:
      - "type: dependencies"
      - "status: needs-triage"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

