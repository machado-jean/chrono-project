<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1280, initial-scale=1" />
    <title>Chrono Project — GitHub Social Preview</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 640px; margin: 0; overflow: hidden; }
      body {
        display: grid;
        grid-template-columns: 430px 1fr;
        align-items: center;
        color: #122836;
        background:
          linear-gradient(90deg, rgba(8, 127, 140, 0.055) 1px, transparent 1px) 0 0 / 80px 80px,
          linear-gradient(rgba(8, 127, 140, 0.055) 1px, transparent 1px) 0 0 / 80px 80px,
          #f7f8f6;
        font-family: "Segoe UI", Arial, sans-serif;
        border: 18px solid #122836;
      }
      .mark-wrap {
        height: 100%;
        display: grid;
        place-items: center;
        position: relative;
        background: #102532;
        border-right: 8px solid #c79221;
      }
      .mark-wrap::before,
      .mark-wrap::after {
        content: "";
        position: absolute;
        right: -32px;
        width: 56px;
        height: 3px;
        background: #c79221;
      }
      .mark-wrap::before { top: 160px; }
      .mark-wrap::after { bottom: 160px; }
      .mark { width: 310px; height: 310px; object-fit: contain; }
      .content { padding: 60px 74px 54px 82px; }
      .eyebrow {
        margin: 0 0 14px;
        color: #087f8c;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 { margin: 0; font-size: 72px; line-height: 1; letter-spacing: -0.045em; }
      .rule { width: 92px; height: 6px; margin: 28px 0; background: #c79221; }
      .lead { margin: 0; max-width: 650px; font-size: 31px; line-height: 1.25; font-weight: 600; }
      .english { margin: 13px 0 30px; color: #536975; font-size: 20px; line-height: 1.35; }
      .features { display: flex; flex-wrap: wrap; gap: 10px 22px; color: #173d49; font-size: 19px; font-weight: 700; }
      .features span::before { content: "•"; margin-right: 10px; color: #087f8c; }
      .meta { margin-top: 34px; color: #6d5a2d; font-size: 17px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <section class="mark-wrap">
      <img class="mark" src="../../src/assets/chrono-mark.png" alt="" />
    </section>
    <main class="content">
      <p class="eyebrow">Desktop · Local-first</p>
      <h1>Chrono Project</h1>
      <div class="rule"></div>
      <p class="lead">Planejamento de projetos com precisão e dados sob seu controle.</p>
      <p class="english">Project planning built for Windows and offline work.</p>
      <div class="features">
        <span>Tabela</span><span>Kanban</span><span>Gantt</span><span>Caminho crítico</span>
      </div>
      <p class="meta">Windows 11 x64 · Offline · MIT</p>
    </main>
  </body>
</html>
